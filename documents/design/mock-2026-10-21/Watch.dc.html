<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>watchOS コンプリケーションとアプリ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Hiragino Sans",system-ui,sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 520px; height: 420px; box-sizing: border-box; background: #1f2937; color: #e5e7eb; padding: 24px; display: flex; gap: 32px; align-items: center; justify-content: center">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
    <div style="width: 198px; height: 242px; border-radius: 44px; background: #000; position: relative; overflow: hidden; padding: 22px 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
      <div style="font-size: 44px; font-weight: 300; line-height: 1; text-align: right">10:24</div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="height: 48px; border-radius: 12px; background: #1f2937; display: flex; align-items: center; gap: 8px; padding: 0 8px; box-sizing: border-box">
          <svg width="40" height="30" viewBox="0 0 96 72" role="img" aria-label="コンプリケーションの猫" style="display: block"><path d="M12 68 C6 56 10 36 22 30 L22 20 L14 6 L28 14 L44 14 L58 6 L50 20 L50 30 C62 36 66 56 60 68 Z" fill="#e5e7eb"/><circle cx="28" cy="22" r="2.4" fill="#000"/><circle cx="44" cy="22" r="2.4" fill="#000"/></svg>
          <span style="font-size: 11px; line-height: 1.3">座っている<br>10:10 から</span>
        </div>
        <div style="display: flex; gap: 8px">
          <div style="width: 48px; height: 48px; border-radius: 24px; background: #1f2937; display: flex; align-items: center; justify-content: center">
            <svg width="30" height="22" viewBox="0 0 96 72" role="img" aria-label="丸いコンプリケーションの猫" style="display: block"><ellipse cx="48" cy="54" rx="38" ry="16" fill="#e5e7eb"/><path d="M62 40 L56 28 L68 34 L80 34 L90 28 L86 40 Z" fill="#e5e7eb"/></svg>
          </div>
          <div style="width: 48px; height: 48px; border-radius: 24px; background: #1f2937"></div>
          <div style="width: 48px; height: 48px; border-radius: 24px; background: #1f2937"></div>
        </div>
      </div>
    </div>
    <span style="font-size: 12px; color: #9ca3af">文字盤 (accessory の 2 種類)</span>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
    <div style="width: 198px; height: 242px; border-radius: 44px; background: #000; position: relative; overflow: hidden">
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #9ca3af">10:24</div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: #243b53"></div>
      <div style="position: absolute; left: 48px; bottom: 70px; width: 100px; height: 75px">
        <svg width="100" height="75" viewBox="0 0 96 72" role="img" aria-label="watch アプリの猫" style="display: block"><path d="M8 60 C4 52 6 40 14 36 L14 24 L6 10 L20 18 L36 18 L50 10 L42 24 L42 36 C50 40 52 52 48 60 Z" fill="{{accent}}"/><ellipse cx="28" cy="50" rx="12" ry="8" fill="{{belly}}"/><path d="M48 44 Q66 36 82 20" stroke="{{accent}}" stroke-width="7" stroke-linecap="round" fill="none"/><rect x="12" y="58" width="7" height="12" rx="3" fill="{{accent}}"/><rect x="34" y="58" width="7" height="12" rx="3" fill="{{accent}}"/><circle cx="20" cy="26" r="2.4" fill="#1f2937"/><circle cx="34" cy="26" r="2.4" fill="#1f2937"/></svg>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 11px; color: #cbd5e1">Always On では静止</div>
    </div>
    <span style="font-size: 12px; color: #9ca3af">watch アプリ</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8863B"},"belly":{"editor":"color","default":"#FBE9D0"},"$preview":{"width":520,"height":420}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E8863B', belly: this.props.belly ?? '#FBE9D0' };
}
}
</script>
</body>
</html>
