<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>iOS ホーム画面ウィジェット</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Hiragino Sans",system-ui,sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1e293b; color: #f8fafc; border-radius: 44px; position: relative; overflow: hidden; padding: 56px 20px 0">
  <div style="position: absolute; left: 115px; top: 12px; width: 160px; height: 36px; border-radius: 18px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; box-sizing: border-box">
    <svg width="26" height="20" viewBox="0 0 96 72" role="img" aria-label="Dynamic Island の猫" style="display: block"><path d="M8 60 C4 52 6 40 14 36 L14 24 L6 10 L20 18 L36 18 L50 10 L42 24 L42 36 C50 40 52 52 48 60 Z" fill="{{accent}}"/><path d="M48 44 Q66 36 82 20" stroke="{{accent}}" stroke-width="9" stroke-linecap="round" fill="none"/></svg>
    <span style="font-size: 11px; color: #e5e7eb">さんぽ中 2:14</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px">
    <div style="height: 158px; border-radius: 22px; background: #0f172a; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
      <div style="font-size: 11px; color: #94a3b8">Cat Walk</div>
      <div style="display: flex; align-items: flex-end; height: 80px; padding-left: {{widgetX}}px">
        <svg width="72" height="54" viewBox="0 0 96 72" role="img" aria-label="ウィジェットの猫" style="display: block"><path d="M12 68 C6 56 10 36 22 30 L22 20 L14 6 L28 14 L44 14 L58 6 L50 20 L50 30 C62 36 66 56 60 68 Z" fill="{{accent}}"/><ellipse cx="36" cy="52" rx="13" ry="10" fill="{{belly}}"/><path d="M60 60 Q78 58 82 44" stroke="{{accent}}" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="28" cy="22" r="2.4" fill="#1f2937"/><circle cx="44" cy="22" r="2.4" fill="#1f2937"/></svg>
      </div>
      <div style="height: 2px; background: #334155; border-radius: 1px"></div>
      <div style="font-size: 11px; color: #94a3b8">窓辺で座っている</div>
    </div>
    <div style="height: 158px; border-radius: 22px; background: #334155"></div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-top: 22px">
    <span style="height: 62px; border-radius: 16px; background: #475569; display: block"></span>
    <span style="height: 62px; border-radius: 16px; background: #475569; display: block"></span>
    <span style="height: 62px; border-radius: 16px; background: #475569; display: block"></span>
    <span style="height: 62px; border-radius: 16px; background: #475569; display: block"></span>
    <span style="height: 62px; border-radius: 16px; background: #475569; display: block"></span>
    <span style="height: 62px; border-radius: 16px; background: #475569; display: block"></span>
    <span style="height: 62px; border-radius: 16px; background: #475569; display: block"></span>
    <span style="height: 62px; border-radius: 16px; background: {{accent}}; display: block"></span>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 22px; height: 92px; border-radius: 30px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: space-around">
    <span style="width: 62px; height: 62px; border-radius: 16px; background: #22c55e; display: block"></span>
    <span style="width: 62px; height: 62px; border-radius: 16px; background: #3b82f6; display: block"></span>
    <span style="width: 62px; height: 62px; border-radius: 16px; background: #a855f7; display: block"></span>
    <span style="width: 62px; height: 62px; border-radius: 16px; background: #f97316; display: block"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8863B"},"belly":{"editor":"color","default":"#FBE9D0"},"widgetX":{"editor":"range","default":30,"min":0,"max":70,"step":5,"unit":"px"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E8863B', belly: this.props.belly ?? '#FBE9D0', widgetX: this.props.widgetX ?? 30 };
}
}
</script>
</body>
</html>
