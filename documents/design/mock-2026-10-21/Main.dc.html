<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>macOS デスクトップを歩く猫</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Hiragino Sans",system-ui,sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #2c3e50; color: #e5e7eb">
  <div style="position: absolute; inset: 0; background: #34495e"></div>
  <div style="position: absolute; left: 0; top: 0; width: 1440px; height: 24px; background: rgba(20,24,30,0.72); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; box-sizing: border-box; font-size: 13px; color: #f3f4f6">
    <div style="display: flex; gap: 18px; align-items: center">
      <span style="font-weight: 700">Finder</span><span>ファイル</span><span>編集</span><span>表示</span><span>移動</span><span>ウインドウ</span><span>ヘルプ</span>
    </div>
    <div style="display: flex; gap: 14px; align-items: center">
      <svg width="18" height="16" viewBox="0 0 18 16" role="img" aria-label="Cat Walk のメニューバーアイコン" style="display: block"><path d="M3 15 V6 L1 1 L5 4 H13 L17 1 L15 6 V15 Z" fill="{{accent}}"/><circle cx="7" cy="9" r="1.2" fill="#1f2937"/><circle cx="11" cy="9" r="1.2" fill="#1f2937"/></svg>
      <span>水 10:24</span>
    </div>
  </div>
  <div style="position: absolute; left: 160px; top: 90px; width: 760px; height: 540px; background: #f9fafb; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); overflow: hidden; color: #111827">
    <div style="height: 38px; background: #e5e7eb; display: flex; align-items: center; padding: 0 12px; gap: 8px; font-size: 13px">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ef4444; display: inline-block"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #f59e0b; display: inline-block"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #22c55e; display: inline-block"></span>
      <span style="margin-left: 10px; color: #374151">企画メモ.txt</span>
    </div>
    <div style="padding: 24px 28px; font-size: 15px; line-height: 1.7; color: #1f2937">
      <div>来週のレビューで見せるもの</div>
      <div>・触れる版のビルド</div>
      <div>・必要な機能の充足状況</div>
      <div>・公開に進むかの判断材料</div>
    </div>
  </div>
  <div style="position: absolute; left: 980px; top: 150px; width: 380px; height: 300px; background: #111827; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); padding: 16px; box-sizing: border-box; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.6; color: #a7f3d0">
    <div>$ make test</div>
    <div style="color: #d1d5db">Test Suite 'CatWalkCoreTests' passed</div>
    <div style="color: #d1d5db">Executed 3 tests, with 0 failures</div>
  </div>
  <div style="position: absolute; left: 0; bottom: 0; width: 1440px; height: 70px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box">
    <div style="display: flex; gap: 10px; background: rgba(255,255,255,0.18); border-radius: 18px; padding: 8px 12px">
      <span style="width: 48px; height: 48px; border-radius: 12px; background: #3b82f6; display: inline-block"></span>
      <span style="width: 48px; height: 48px; border-radius: 12px; background: #a855f7; display: inline-block"></span>
      <span style="width: 48px; height: 48px; border-radius: 12px; background: #10b981; display: inline-block"></span>
      <span style="width: 48px; height: 48px; border-radius: 12px; background: #f97316; display: inline-block"></span>
      <span style="width: 48px; height: 48px; border-radius: 12px; background: #e5e7eb; display: inline-block"></span>
    </div>
  </div>
  <div style="position: absolute; left: {{catX}}px; bottom: 72px; width: 96px; height: 72px">
    <svg width="96" height="72" viewBox="0 0 96 72" role="img" aria-label="Dock の上を歩くオレンジの猫" style="display: block">
      <path d="M8 60 C4 52 6 40 14 36 L14 24 L6 10 L20 18 L36 18 L50 10 L42 24 L42 36 C50 40 52 52 48 60 Z" fill="{{accent}}"/>
      <ellipse cx="28" cy="50" rx="12" ry="8" fill="{{belly}}"/>
      <path d="M48 44 C64 40 70 48 74 56 C78 64 72 70 66 68 C72 60 66 52 56 54" fill="{{accent}}"/>
      <path d="M48 44 Q66 36 82 20" stroke="{{accent}}" stroke-width="7" stroke-linecap="round" fill="none"/>
      <rect x="14" y="58" width="7" height="12" rx="3" fill="{{accent}}"/>
      <rect x="30" y="58" width="7" height="12" rx="3" fill="{{accent}}"/>
      <circle cx="20" cy="26" r="2.4" fill="#1f2937"/>
      <circle cx="34" cy="26" r="2.4" fill="#1f2937"/>
      <path d="M24 32 L28 35 L32 32" stroke="#7c2d12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8863B","options":["#E8863B","#6B7280","#1F2937","#F5E6C8"]},"belly":{"editor":"color","default":"#FBE9D0"},"catX":{"editor":"range","default":560,"min":0,"max":1340,"step":10,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E8863B', belly: this.props.belly ?? '#FBE9D0', catX: this.props.catX ?? 560 };
}
}
</script>
</body>
</html>
