<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>iOS アプリ本体</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Hiragino Sans",system-ui,sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1e293b; color: #f8fafc; border-radius: 44px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="height: 110px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 24px 12px; box-sizing: border-box">
    <div style="font-size: 28px; font-weight: 700">Cat Walk</div>
    <button type="button" aria-label="設定" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div style="flex: 1; position: relative; margin: 0 16px; border-radius: 28px; background: #0f172a; overflow: hidden">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 60%; background: #16213a"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: #243b53"></div>
    <div style="position: absolute; left: 24px; top: 24px; width: 120px; height: 150px; border-radius: 10px; background: #334155; border: 6px solid #475569; box-sizing: border-box"></div>
    <div style="position: absolute; left: {{catX}}px; bottom: 56px; width: 140px; height: 105px">
      <svg width="140" height="105" viewBox="0 0 96 72" role="img" aria-label="部屋を歩く猫" style="display: block"><path d="M8 60 C4 52 6 40 14 36 L14 24 L6 10 L20 18 L36 18 L50 10 L42 24 L42 36 C50 40 52 52 48 60 Z" fill="{{accent}}"/><ellipse cx="28" cy="50" rx="12" ry="8" fill="{{belly}}"/><path d="M48 44 Q66 36 82 20" stroke="{{accent}}" stroke-width="7" stroke-linecap="round" fill="none"/><rect x="12" y="58" width="7" height="12" rx="3" fill="{{accent}}"/><rect x="34" y="58" width="7" height="12" rx="3" fill="{{accent}}"/><circle cx="20" cy="26" r="2.4" fill="#1f2937"/><circle cx="34" cy="26" r="2.4" fill="#1f2937"/><path d="M24 32 L28 35 L32 32" stroke="#7c2d12" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 13px; color: #94a3b8">タップでなでる</div>
  </div>
  <div style="height: 140px; padding: 20px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: {{accent}}; color: #1f2937; font-size: 16px; font-weight: 600">さんぽに出す (Dynamic Island)</button>
    <div style="font-size: 12px; color: #94a3b8; text-align: center">8 時間でおうちに帰ります</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8863B"},"belly":{"editor":"color","default":"#FBE9D0"},"catX":{"editor":"range","default":150,"min":0,"max":210,"step":10,"unit":"px"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E8863B', belly: this.props.belly ?? '#FBE9D0', catX: this.props.catX ?? 150 };
}
}
</script>
</body>
</html>
