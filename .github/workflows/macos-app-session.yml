# macOS アプリのセッションを張る caller workflow。実体は bannzai/simtunnel の macos-session.yml（reusable workflow）。
# 参照: https://github.com/bannzai/simtunnel の PROJECT.md「各アプリ repo での実行（reusable workflow）」
name: macos-app-session
# run-name は local/simtunnel CLI が run を特定するキーのためこの形式を維持する
run-name: "session=${{ inputs.session }} runner=${{ inputs.runner }}"

on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    inputs:
      session:
        description: "セッション名。tailnet ホスト名 simtunnel-<session> になる（小文字英数字とハイフンのみ）"
        required: true
        default: cat-walk-mac
      device:
        description: "local/simtunnel の up が常に送るため宣言する（macOS では未使用）"
        required: false
        default: "-"
      duration_minutes:
        description: "セッション維持時間（分）"
        required: true
        default: "30"
      runner:
        description: "macOS runner のラベル"
        required: false
        default: macos-26

permissions: {}

jobs:
  session:
    # id-token: write が必要なのは reusable workflow を呼ぶこの job だけのため、job 単位で最小権限にする
    permissions:
      id-token: write # Tailscale の OIDC (workload identity federation) 認証に必要
      contents: read
    # タグ運用はしないため main の commit SHA で固定する（更新時は SHA を書き換える）
    uses: bannzai/simtunnel/.github/workflows/macos-session.yml@f1cb26f32066774564c1450202a6a10fa79635fb # main 2026-10-16
    with:
      session: ${{ inputs.session }}
      runner: ${{ inputs.runner }}
      duration_minutes: ${{ inputs.duration_minutes }}
      build_project: CatWalk.xcodeproj
      build_scheme: CatWalk
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
